
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Просмотр трансляции</title>

    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 30px;
        }

        #videoPlayer {
            border: 4px solid #333;
            border-radius: 8px;
            background: #000;
            width: 640px;
            height: 480px;
            object-fit: contain;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: #00bcd4;
            color: white;
        }

        #status {
            color: #aaa;
        }
    </style>
</head>

<body>

    <h1>Прямой эфир с экрана</h1>

    <img id="videoPlayer" alt="Ожидание трансляции...">

    <div class="controls">

        <p id="status">Подключение...</p>

        <button id="startAudio">
            Включить звук
        </button>

    </div>

    <script>

        const videoPlayer =
            document.getElementById("videoPlayer");

        const audioBtn =
            document.getElementById("startAudio");

        const status =
            document.getElementById("status");

        const ws = new WebSocket('ws://localhost:8081');

        let audioCtx = null;
        let nextStartTime = 0;

        // Подключение WebSocket
        ws.onopen = () => {
            status.textContent = "Подключено";
            status.style.color = "#4caf50";
        };

        ws.onerror = (error) => {
            status.textContent = "Ошибка подключения";
            console.error("WebSocket:", error);
        };

        ws.onclose = () => {
            status.textContent = "Соединение закрыто";
        };

        // Активация звука после клика пользователя
        audioBtn.addEventListener("click", async () => {

            try {

                if (!audioCtx) {

                    audioCtx = new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )({
                        sampleRate: 16000
                    });

                }

                await audioCtx.resume();

                nextStartTime = audioCtx.currentTime;

                audioBtn.textContent = "Звук включен";
                audioBtn.style.background = "#4caf50";

                console.log(
                    "AudioContext:",
                    audioCtx.state,
                    audioCtx.sampleRate
                );

            }
            catch (error) {
                console.error("AudioContext error:", error);
            }

        });

        // Получение сообщений
        ws.onmessage = async (event) => {

            try {

                const payload = JSON.parse(event.data);

                // Видео
                if (payload.type === "video_frame") {

                    videoPlayer.src =
                        "data:image/jpeg;base64," + payload.data;

                }

                // Аудио
                else if (
                    payload.type === "audio_chunk" &&
                    audioCtx &&
                    audioCtx.state === "running"
                ) {

                    const binary = atob(payload.data);

                    if (binary.length < 2 ||
                        binary.length % 2 !== 0) {
                        return;
                    }

                    const pcmData = new Int16Array(
                        binary.length / 2
                    );

                    for (
                        let i = 0;
                        i < pcmData.length;
                        i++
                    ) {

                        const low = binary.charCodeAt(i * 2);
                        const high = binary.charCodeAt(i * 2 + 1);

                        let value = low | (high << 8);

                        if (value >= 32768) {
                            value -= 65536;
                        }

                        pcmData[i] = value;

                    }

                    // Создание аудиобуфера
                    const audioBuffer =
                        audioCtx.createBuffer(
                            1,
                            pcmData.length,
                            16000
                        );

                    const channel =
                        audioBuffer.getChannelData(0);

                    // Int16 -> Float32
                    for (
                        let i = 0;
                        i < pcmData.length;
                        i++
                    ) {

                        channel[i] =
                            pcmData[i] / 32768.0;

                    }

                    const source =
                        audioCtx.createBufferSource();

                    source.buffer = audioBuffer;
                    source.connect(audioCtx.destination);

                    // Планирование воспроизведения
                    if (
                        nextStartTime <
                        audioCtx.currentTime
                    ) {
                        nextStartTime =
                            audioCtx.currentTime + 0.02;
                    }

                    // Не допускаем чрезмерного накопления очереди
                    if (
                        nextStartTime - audioCtx.currentTime > 1
                    ) {
                        nextStartTime =
                            audioCtx.currentTime + 0.02;
                    }

                    source.start(nextStartTime);

                    nextStartTime += audioBuffer.duration;

                }

            }
            catch (error) {

                console.error(
                    "Ошибка обработки пакета:",
                    error
                );

            }

        };

    </script>

</body>
</html>
